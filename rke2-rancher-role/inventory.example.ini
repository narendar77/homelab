# Example inventory file for RKE2 Rancher installation
# Copy this to inventory.ini and update with your actual values

[rke2_master]
rke2localmaster01 ansible_host=192.168.10.199 ansible_user=root

[rke2_workers]
rke2localworker01 ansible_host=192.168.10.156 ansible_user=root
rke2localworker02 ansible_host=192.168.10.81 ansible_user=root

[rke2_cluster:children]
rke2_master
rke2_workers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
